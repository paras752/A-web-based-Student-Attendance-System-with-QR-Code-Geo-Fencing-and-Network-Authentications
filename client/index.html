<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSAS — Smart Student Attendance System</title>
    <script>
      // Runs before first paint so the saved theme is applied with no flash of the
      // wrong one. React's ThemeProvider takes over once mounted and keeps using
      // this same storage key, so the two never disagree.
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('ssas-theme');
          theme = stored === 'light' || stored === 'dark' ? stored : null;
        } catch (e) {
          theme = null;
        }
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
