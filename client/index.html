<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSAS — Smart Student Attendance System</title>
    <script>
      // Set before first paint so Bootstrap 5.3's built-in dark theme (navbar,
      // cards, tables, forms) matches the OS scheme with no flash of the wrong theme.
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.setAttribute('data-bs-theme', media.matches ? 'dark' : 'light');
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
